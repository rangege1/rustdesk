name: Build customer Windows client

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  SCITER_RUST_VERSION: "1.75"
  LLVM_VERSION: "15.0.6"
  FLUTTER_VERSION: "3.24.5"
  VCPKG_BINARY_SOURCES: "clear;x-gha,readwrite"
  VCPKG_COMMIT_ID: "9e593bb18ea69cc5095e012465dcd675a822ed0d"
  VERSION: "1.4.9"

jobs:
  generate-bridge:
    uses: ./.github/workflows/bridge.yml

  build-topmost-window:
    uses: ./.github/workflows/third-party-RustDeskTempTopMostWindow.yml
    with:
      upload-artifact: true
      target: windows-2022
      configuration: Release
      platform: x64
      target_version: Windows10

  build-customer-windows:
    name: Windows x64 MSI and EXE
    needs: [generate-bridge, build-topmost-window]
    runs-on: windows-2022
    steps:
      - name: Export GitHub Actions cache environment variables
        uses: actions/github-script@d7906e4ad0b1822421a7e6a35d5ca353c962f410
        with:
          script: |
            core.exportVariable('ACTIONS_CACHE_URL', process.env.ACTIONS_CACHE_URL || '');
            core.exportVariable('ACTIONS_RUNTIME_TOKEN', process.env.ACTIONS_RUNTIME_TOKEN || '');

      - name: Checkout source code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          submodules: recursive

      - name: Enable file transfer defaults
        shell: pwsh
        run: |
          $config = "libs/hbb_common/src/config.rs"
          $text = Get-Content $config -Raw
          $needle = 'keys::OPTION_CUSTOM_FPS => self.get_num_string(key, 30.0, 5.0, 120.0),'
          $replacement = "$needle`r`n            keys::OPTION_ENABLE_FILE_TRANSFER => self.get_string(key, `"Y`", vec![`"`", `"N`"]),"
          if (-not $text.Contains($needle)) { throw "RustDesk config insertion point not found" }
          if (-not $text.Contains("OPTION_ENABLE_FILE_TRANSFER => self.get_string")) {
            $text = $text.Replace($needle, $replacement)
            Set-Content $config $text -NoNewline
          }

      - name: Restore bridge files
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: bridge-artifact
          path: ./

      - name: Install LLVM and Clang
        uses: KyleMayes/install-llvm-action@ebc0426251bc40c7cd31162802432c68818ab8f0
        with:
          version: ${{ env.LLVM_VERSION }}

      - name: Install Flutter
        uses: subosito/flutter-action@2783a3f08e1baf891508463f8c6653c258246225
        with:
          channel: stable
          flutter-version: ${{ env.FLUTTER_VERSION }}
          architecture: x64

      - name: Replace engine with RustDesk custom Flutter engine
        run: |
          flutter doctor -v
          flutter precache --windows
          Invoke-WebRequest -Uri https://github.com/rustdesk/engine/releases/download/main/windows-x64-release.zip -OutFile windows-x64-release.zip
          Expand-Archive -Path windows-x64-release.zip -DestinationPath windows-x64-release
          mv -Force windows-x64-release/* C:/hostedtoolcache/windows/flutter/stable-${{ env.FLUTTER_VERSION }}-x64/bin/cache/artifacts/engine/windows-x64-release/

      - name: Patch Flutter
        shell: bash
        run: |
          cp .github/patches/flutter_3.24.4_dropdown_menu_enableFilter.diff $(dirname $(dirname $(which flutter)))
          cd $(dirname $(dirname $(which flutter)))
          git apply flutter_3.24.4_dropdown_menu_enableFilter.diff

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9
        with:
          toolchain: ${{ env.SCITER_RUST_VERSION }}
          targets: x86_64-pc-windows-msvc
          components: rustfmt

      - uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32
        with:
          prefix-key: customer-windows-2022

      - name: Setup vcpkg with GitHub Actions binary cache
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2
        with:
          vcpkgDirectory: C:\vcpkg
          vcpkgGitCommitId: ${{ env.VCPKG_COMMIT_ID }}
          doNotCache: false

      - name: Install vcpkg dependencies
        shell: bash
        run: |
          if ! $VCPKG_ROOT/vcpkg install --triplet x64-windows-static --x-install-root="$VCPKG_ROOT/installed"; then
            find "${VCPKG_ROOT}/" -name "*.log" -exec sh -c 'echo "$1:"; cat "$1"' _ {} \;
            exit 1
          fi

      - name: Build RustDesk
        run: |
          python3 .\build.py --portable --flutter --skip-portable-pack
          mv ./flutter/build/windows/x64/runner/Release ./rustdesk
          Invoke-WebRequest -Uri https://github.com/rustdesk-org/rdev/releases/download/usbmmidd_v2/usbmmidd_v2.zip -OutFile usbmmidd_v2.zip
          Expand-Archive usbmmidd_v2.zip -DestinationPath .
          Remove-Item -Path usbmmidd_v2\Win32 -Recurse
          Remove-Item -Path "usbmmidd_v2\deviceinstaller64.exe", "usbmmidd_v2\deviceinstaller.exe", "usbmmidd_v2\usbmmidd.bat"
          mv -Force .\usbmmidd_v2 ./rustdesk
          try {
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/rustdesk_printer_driver_v4-1.4.zip -OutFile rustdesk_printer_driver_v4-1.4.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/printer_driver_adapter.zip -OutFile printer_driver_adapter.zip
            Invoke-WebRequest -Uri https://github.com/rustdesk/hbb_common/releases/download/driver/sha256sums -OutFile sha256sums
            $driverSum = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*rustdesk_printer_driver_v4-1.4\.zip$').Matches.Groups[1].Value
            $adapterSum = (Select-String -Path .\sha256sums -Pattern '^([a-fA-F0-9]{64}) \*printer_driver_adapter\.zip$').Matches.Groups[1].Value
            if ($driverSum -eq (Get-FileHash rustdesk_printer_driver_v4-1.4.zip -Algorithm SHA256).Hash -and $adapterSum -eq (Get-FileHash printer_driver_adapter.zip -Algorithm SHA256).Hash) {
              Expand-Archive rustdesk_printer_driver_v4-1.4.zip -DestinationPath .
              mkdir ./rustdesk/drivers
              mv -Force .\rustdesk_printer_driver_v4-1.4 ./rustdesk/drivers/RustDeskPrinterDriver
              Expand-Archive printer_driver_adapter.zip -DestinationPath .
              mv -Force .\printer_driver_adapter.dll ./rustdesk
            }
          } catch {
            Write-Host "Printer driver download skipped."
          }

      - name: Copy Runner resource
        continue-on-error: true
        shell: bash
        run: |
          runner_res=$(find . -name "Runner.res" | head -n 1)
          test -z "$runner_res" || cp "$runner_res" ./libs/portable/Runner.res

      - name: Restore topmost window component
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c
        with:
          name: topmostwindow-artifacts-x64
          path: ./rustdesk

      - name: Build portable EXE
        shell: bash
        run: |
          sed -i '/dpiAware/d' res/manifest.xml
          pushd ./libs/portable
          pip3 install -r requirements.txt
          python3 ./generate.py -f ../../rustdesk/ -o . -e ../../rustdesk/rustdesk.exe
          popd
          mkdir -p ./SignOutput
          mv ./target/release/rustdesk-portable-packer.exe ./SignOutput/rustdesk-${{ env.VERSION }}-x86_64.exe

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@6fb02220983dee41ce7ae257b6f4d8f9bf5ed4ce

      - name: Build customer MSI
        run: |
          python -m pip install pyinstaller psutil pywin32
          pyinstaller --noconfirm --clean --onefile --noconsole --name customer-agent --distpath ./rustdesk ./customer-agent/agent.py
          pushd ./res/msi
          python preprocess.py --arp -d ../../rustdesk
          nuget restore msi.sln
          msbuild msi.sln -p:Configuration=Release -p:Platform=x64 /p:TargetVersion=Windows10
          $msi = Get-ChildItem ./Package/bin/*/Release/en-us/Package.msi | Select-Object -First 1
          if (-not $msi) { throw "Package.msi was not created" }
          mv $msi.FullName ../../SignOutput/rustdesk-${{ env.VERSION }}-x86_64.msi
          Get-FileHash ../../SignOutput/rustdesk-*.msi -Algorithm SHA256

      - name: Build staff Worker
        shell: pwsh
        run: |
          python -m pip install pyinstaller
          pyinstaller --noconfirm --clean --onefile --console --name rustdesk-worker --distpath ./rustdesk ./staff-worker/worker.py
          if (-not (Test-Path ./rustdesk/rustdesk-worker.exe)) {
            throw "客服 Worker EXE 未生成。"
          }

      - name: Build single-file customer EXE
        shell: pwsh
        run: |
          $agentExe = Join-Path $PWD "rustdesk/customer-agent.exe"
          if (-not (Test-Path $agentExe)) {
            throw "客户单文件 EXE 未生成：找不到 $agentExe。"
          }
          pwsh ./customer-installer/build-single-client.ps1 `
            -RustDeskDir ./rustdesk `
            -Role customer `
            -AgentExe $agentExe `
            -Output ./SignOutput/remote-install-client-x86_64.exe
          if (-not (Test-Path ./SignOutput/remote-install-client-x86_64.exe)) {
            throw "客户单文件 EXE 未生成。"
          }
          Get-Item ./SignOutput/remote-install-client-x86_64.exe | Select-Object Name, @{Name = 'SizeMB'; Expression = { [math]::Round($_.Length / 1MB, 2) }}
          Get-FileHash ./SignOutput/remote-install-client-x86_64.exe -Algorithm SHA256

      - name: Build single-file staff EXE
        shell: pwsh
        run: |
          if (-not "${{ secrets.OPS_WORKER_TOKEN }}") {
            throw "缺少 GitHub Secret：OPS_WORKER_TOKEN"
          }
          if (-not (Test-Path ./rustdesk/rustdesk-worker.exe)) {
            throw "找不到 rustdesk-worker.exe"
          }
          pwsh ./customer-installer/build-single-client.ps1 `
            -RustDeskDir ./rustdesk `
            -Role staff `
            -WorkerExe ./rustdesk/rustdesk-worker.exe `
            -WorkerToken "${{ secrets.OPS_WORKER_TOKEN }}" `
            -Output ./SignOutput/remote-install-staff-x86_64.exe
          Get-Item ./SignOutput/remote-install-staff-x86_64.exe | Select-Object Name, @{Name = 'SizeMB'; Expression = { [math]::Round($_.Length / 1MB, 2) }}
          Get-FileHash ./SignOutput/remote-install-staff-x86_64.exe -Algorithm SHA256

      - name: Upload customer single-file client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remote-install-customer-windows-x64
          path: ./SignOutput/remote-install-client-x86_64.exe
          if-no-files-found: error

      - name: Upload staff client
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: remote-install-staff-windows-x64
          path: ./SignOutput/remote-install-staff-x86_64.exe
          if-no-files-found: error

      - name: Upload all build artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: customer-rustdesk-build-artifacts
          path: ./SignOutput/
          if-no-files-found: error
